[all:vars]
ansible_user=vagrant
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3

[nfs-server]
node1 ansible_host=192.168.33.10 ansible_ssh_private_key_file=./.vagrant/machines/node1/virtualbox/private_key

[nfs-client]
node2 ansible_host=192.168.33.11 ansible_ssh_private_key_file=./.vagrant/machines/node2/virtualbox/private_key
node3 ansible_host=192.168.33.12 ansible_ssh_private_key_file=./.vagrant/machines/node3/virtualbox/private_key

[all:children]
nfs-server
nfs-client
